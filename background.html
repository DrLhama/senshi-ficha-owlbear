<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Senshi · fundo</title></head>
<body>
<script type="module">
  // Fica ligado sem nenhuma janela aberta: aplica na ficha o ajuste pedido pelo mestre, avisa a vez no combate
  // e cuida das janelas (reabre as que estavam na tela, organiza, fecha).
  import { OBR, CANAL_AJUSTE, CHAVE_INI, LOCAL, LOCAL_INI, ler, guardar, publicarFicha, aplicarExpressao, registrar } from "./shared.js?v=18";
  import { RESULTADO, CHAVE_ROLAGENS } from "./dados.js?v=18";
  import { CONFIG, canal, lerJanelas, abrirPopover, limparJanelas, organizar, fecharOutras, abrirBussola, BUSSOLA, tela } from "./janelas.js?v=18";

  import { CANAL_PASSO, PRONTO, INI_VAZIA, avancar, faltaAnimacao, publicarIni } from "./iniciativa.js?v=18";

  // ── a bússola ───────────────────────────────────────────────
  let largura = 0, espera, rolAnterior;
  async function bussola(meta) {
    const ini = meta[CHAVE_INI], falta = faltaAnimacao(ini), quer = !!ini && (ini.ativo ? !falta : !!ini.chamada);
    clearTimeout(espera);
    if (falta) espera = setTimeout(async () => { const m = await OBR.room.getMetadata(); vez(m); bussola(m); }, falta + 40);
    // a rolagem começou: o dado sai da mão
    if (rolAnterior !== undefined && ini?.rol?.id && ini.rol.id !== rolAnterior) OBR.player.setMetadata({ [PRONTO]: undefined }).catch(console.warn);
    rolAnterior = ini?.rol?.id ?? null;
    if (!quer) { if (largura) { largura = 0; await OBR.popover.close(BUSSOLA); } return; }
    // a janela do navegador mudou de largura: volta para o centro
    if (largura && largura === (await tela()).w) return;
    largura = largura || 1;
    largura = await abrirBussola();
  }
  // qualquer jogador clica na seta; só o navegador do mestre muda a lista (ele conhece os ocultos)
  async function passo({ data }) {
    if (!data || (data.passo !== 1 && data.passo !== -1) || await OBR.player.getRole() !== "GM") return;
    // com a sala aberta em duas abas, o mesmo clique vale uma vez só
    if (ler("senshi/ini-ultimo") === data.id) return;
    guardar("senshi/ini-ultimo", data.id);
    const ini = ler(LOCAL_INI);
    if (ini?.ativo && ini.combatentes?.length) await publicarIni(avancar({ ...INI_VAZIA(), ...ini }, data.passo));
  }

  let vezAnterior;
  function vez(meta) {
    const ini = meta[CHAVE_INI];
    const minha = !!ini?.ativo && !faltaAnimacao(ini) && !!ini.combatentes?.some(c => c.id === ini.vez && c.jogador === OBR.player.id);
    const marca = minha ? `${ini.ciclo}:${ini.turno}:${ini.vez}` : "";
    if (marca && marca !== vezAnterior && vezAnterior !== undefined) OBR.notification.show("É a sua vez!", "SUCCESS");
    if (marca !== vezAnterior) OBR.action.setBadgeText(minha ? "!" : undefined).catch(() => {});
    vezAnterior = marca;
  }

  OBR.onReady(async () => {
    OBR.broadcast.onMessage(CANAL_AJUSTE, async ({ data }) => {
      if (!data || data.para !== OBR.player.id) return;
      const ficha = ler(LOCAL);
      const rc = ficha?.recursos?.find(r => r.id === data.recurso);
      if (!rc) return;
      // o mestre manda o texto digitado (+25, -50%…): quem aplica é a ficha do jogador, sobre o valor dela
      const novo = aplicarExpressao(rc.atual, rc.max, data.expr ?? data.atual);
      if (novo == null) return;
      registrar(rc, rc.atual, novo, "mestre");
      rc.atual = novo;
      guardar(LOCAL, ficha);
      await publicarFicha(ficha);
    });

    // anota o resultado mesmo que a janela que pediu já tenha sido fechada ou movida
    OBR.broadcast.onMessage(RESULTADO, async ({ data, connectionId }) => {
      if (typeof data?.total !== "number" || connectionId !== await OBR.player.getConnectionId()) return;
      const nota = { t: Date.now(), nome: String(data.rotulo || ""), notacao: String(data.formula || ""), total: data.total, texto: String(data.texto || "") };
      guardar(CHAVE_ROLAGENS, [nota, ...(ler(CHAVE_ROLAGENS) || [])].slice(0, 40));
    });

    if (canal) canal.onmessage = ({ data }) => {
      if (data?.t === "organizar") organizar();
      else if (data?.t === "fechar-outras") fecharOutras(data.menos);
      else if (data?.t === "bussola") OBR.popover.close(BUSSOLA).then(abrirBussola);
      else if (data?.t === "reabrir") OBR.popover.close(data.id).then(() => abrirPopover(data.id));
    };

    OBR.broadcast.onMessage(CANAL_PASSO, passo);
    const sala = await OBR.room.getMetadata();
    vez(sala);
    bussola(sala);
    OBR.room.onMetadataChange(m => { vez(m); bussola(m); });

    if ((ler(CONFIG) || {}).reabrir === false) limparJanelas();
    else for (const id of Object.keys(lerJanelas())) await abrirPopover(id);
  });
</script>
</body></html>
